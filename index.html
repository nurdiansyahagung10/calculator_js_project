<!doctype html>
<html lang="en">

<head>

    <link rel='stylesheet'
        href='https://cdn-uicons.flaticon.com/2.0.0/uicons-solid-straight/css/uicons-solid-straight.css'>
    <link rel="preconnect" href="https://fonts.googleapis.com">

<style>
    * {
        font-family: 'Poppins', sans-serif;
        transition: 0.3s all;
    }

    table tbody tr td {
        background: #425062;

    }

    .bs {
        background: #15181e !important;
        color: #9ca3af !important;
    }



    td:active {
        cursor: pointer;
        transform: scale(0.97);
        background-color: #6366f1 !important;
        color: white !important;
    }

    .blinked {
        opacity: 5%;
    }

    ::-webkit-scrollbar {
        height: 3px !important;
        width: 3px !important;
    }


    ::-webkit-scrollbar-track {
        background: transparent;
        height: 4px !important;

    }

    ::-webkit-scrollbar-thumb {
        background: gray;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: #555;
    }

    .text-muncul {
        width: 100%;
        background-color: transparent;
        resize: none;
        min-height: 25px;
        height: auto;
    }
</style>

<body class="bg-light ">

                <div class="toast-body text-white text-notif">
                </div>
            </div>

        </div>

                        <tr>
                            <td style="padding-top: 35px;   background: #15181e ; border-color: #2a2f3a !important; padding-bottom: 35px;"
                                class=" col-3  text-center h2 bt">.</td>
                            <td style="padding-top: 35px;   background: #15181e ; border-color: #2a2f3a !important; padding-bottom: 35px;"

                            <td style="padding-top: 35px;   background: #15181e ; border-color: #2a2f3a !important; padding-bottom: 35px;"

                            <td style="padding-top: 35px;   background: #15181e ; border-color: #2a2f3a !important; padding-bottom: 35px;"

            </div>
        </div>
        <div class="offcanvas offcanvas-start" style="background-color: #0f1115 ;" tabindex="-1" id="offcanvasExample"
            aria-labelledby="offcanvasExampleLabel">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title text-white" id="offcanvasExampleLabel">Options</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"

            </div>
            <div class="offcanvas-body">
                <table class="table  table-dark mb-0 pb-0" style="border-collapse: separate;">

                        <tr>
